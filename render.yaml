services:
  - type: web
    name: nyayasaathi
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address=0.0.0.0 --server.port=$PORT --server.headless=true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: whisper-large-v3-turbo
      - key: APP_MODE
        value: production
      - key: LLM_PROVIDER
        value: gemini
